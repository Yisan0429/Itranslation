name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint (syntax + undefined names only)
        run: uvx ruff check src translate_book.py desktop.py tests scripts

      - name: Unit tests
        run: uv run pytest -q

      - name: Version consistency
        run: uv run python scripts/check_version.py

      - name: Component benchmark (no API)
        run: uv run python src/benchmark.py --quick
