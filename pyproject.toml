[project]
name = "Itranslation"
version = "1.5.0"
description = "AI 全书翻译 — PDF/EPUB/TXT/Markdown → 中文"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.27",
    "rich>=13",
    "tenacity>=9",
    "fpdf2>=2.8",
    "ebooklib>=0.20",
    "beautifulsoup4>=4.15",
    "nicegui>=3.13.0",
    "pywebview>=6.2.1",
    "litellm>=1.80.0",
    "nltk>=3.9.4",
    "sacrebleu>=2.6.0",
]

[project.optional-dependencies]
vision = ["marker-pdf>=1.10"]
rat = ["chromadb>=1.5", "sentence-transformers>=5.5"]
full = ["Itranslation[vision,rat]"]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# 仅拦截致命问题（语法错误 / 未定义名称），风格问题暂不纳入 CI
select = ["E9", "F63", "F7", "F82"]
