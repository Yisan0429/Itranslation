[project]
name = "Itranslation"
version = "1.3.3"
description = "AI 全书翻译 — PDF/EPUB/TXT/Markdown → 中文"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.27",
    "rich>=13",
    "tenacity>=9",
    "fpdf2>=2.8",
    "ebooklib>=0.20",
    "beautifulsoup4>=4.15",
    "nicegui>=3.13.0",
    "pywebview>=6.2.1",
    "litellm>=1.80.0",
    "nltk>=3.9.4",
    "sacrebleu>=2.6.0",
]

[project.optional-dependencies]
vision = ["marker-pdf>=1.10"]
rat = ["chromadb>=1.5", "sentence-transformers>=5.5"]
full = ["Itranslation[vision,rat]"]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
