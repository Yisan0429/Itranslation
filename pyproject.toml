[project]
name = "Itranslation"
version = "1.1.3"
description = "AI 全书翻译 — PDF/EPUB/TXT/Markdown → 中文"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.27",
    "nltk>=3.9",
    "rich>=13",
    "tenacity>=9",
    "fpdf2>=2.8",
    "ebooklib>=0.20",
    "beautifulsoup4>=4.15",
]

[project.optional-dependencies]
vision = ["marker-pdf>=1.10"]
rat = ["chromadb>=1.5", "sentence-transformers>=5.5"]
full = ["Itranslation[vision,rat]"]
